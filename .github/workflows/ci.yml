name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Install numpy (notification-chime determinism test)
        run: python3 -m pip install --quiet numpy

      - name: Run tests
        run: npm test

      - name: Consistency checks (palette colors, <Screen> root, offline-fetch timeouts)
        run: npm run check:consistency
      - name: no-resurrected-fork
        # The activation fork overlay was deleted on purpose (killed 2026-09-27, regressed
        # 2026-10-06). FirstRunHeroOverlay is the only first-run surface. Do not re-add it.
        run: "! grep -rn 'ActivationForkOverlay' src app"
      - name: no-system-alert
        # Alert.alert is the OS dialog (white Material dialog on Android). Use appAlert() -> ConfirmSheet.
        run: "! grep -rnE '^[^/*]*Alert\\.alert\\(' app src stores lib"
      - name: hero-modal-no-fade
        # A fading hero Modal exposes a blank/skeleton frame after "Ouvrir mon commerce".
        run: grep -q 'animationType="none"' src/components/FirstRunHeroOverlay.tsx

      - name: Lint (react-hooks/rules-of-hooks)
        run: npm run lint

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high || true
