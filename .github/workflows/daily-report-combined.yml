name: Rapport quotidien combiné

# Replaces the "Patron — Rapport Quotidien Combiné" Claude cloud routine,
# which was silently failing every day (cloud-sandbox egress policy blocked
# its POST to *.supabase.co — see CLAUDE.md). GitHub Actions runners have
# unrestricted outbound access, so this runs the same checks + POSTs to the
# same relay directly, with no dependency on that policy.

on:
  schedule:
    - cron: '3 10 * * *'  # ~6h03 ET — off the exact hour to dodge scheduler congestion
  workflow_dispatch:

jobs:
  rapport-combine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — the script diffs db/migration_v*.sql over the last 7 days

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate and send combined report
        env:
          REPORT_RELAY_SECRET: ${{ secrets.REPORT_RELAY_SECRET }}
        run: node scripts/daily-report-combined.js
