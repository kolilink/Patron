<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

    <title>On t'invite sur Patron.</title>
    <meta name="description" content="Note tes ventes, suis tes crédits avec ou sans internet" />

    <!-- Static Open Graph / Twitter tags (mirror invite/index.html) so link
       crawlers that land on an unknown path (e.g. /invite/<CODE>, which
       GitHub Pages routes to this 404.html) still get a valid card. -->
    <meta property="og:title" content="On t'invite sur Patron." />
    <meta property="og:description" content="Note tes ventes, suis tes crédits avec ou sans internet" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://patron.kolilink.com/invite" />
    <meta property="og:image" content="https://patron.kolilink.com/invite/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
        // GitHub Pages serves this 404.html for any unknown path. The invite
        // link form /invite/<inviter-id> has no static file, so it is routed
        // to the landing page carrying the id as ?i=… . Anything else falls
        // back to the generic invite page.
        (function () {
            var path = (window.location.pathname || '').replace(/\/+$/, '');
            var m = path.match(/^\/invite\/([0-9a-fA-F-]{36})$/);
            if (m) {
                window.location.replace('/invite?i=' + encodeURIComponent(m[1].toLowerCase()));
            } else {
                window.location.replace('/invite');
            }
        })();
    </script>
</head>

<body
    style="font-family:system-ui,sans-serif;background:#6366F1;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0">
    <p><a href="/invite" style="color:#fff">Ouvrir Patron →</a></p>
</body>

</html>
