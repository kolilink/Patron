<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <title>Patron — carte d'invitation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 1200px;
            height: 630px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #6366F1 0%, #4F46E5 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 80px;
        }

        .brand {
            font-size: 110px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .tagline {
            margin-top: 32px;
            font-size: 56px;
            font-weight: 700;
            line-height: 1.3;
        }

        .foot {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 48px;
            text-align: center;
            font-size: 26px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.06em;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="brand">Patron</div>
        <div class="tagline">Plus de page perdue —<br />plus un franc perdu.</div>
    </div>
    <div class="foot">Gratuit · Fait pour les commerçants</div>
</body>

</html>
